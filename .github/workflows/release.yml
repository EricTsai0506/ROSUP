# main 上的 ro_bot.py VERSION 變成新的版本號時：在 GitHub 的 Windows 電腦上打包 exe，發布成新版本
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 讀取版本號、檢查是不是新版
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = (Select-String -Path ro_bot.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { "new=false" >> $env:GITHUB_OUTPUT; Write-Host "v$v 已經發布過，跳過" }
          else { "new=true" >> $env:GITHUB_OUTPUT; Write-Host "要發布 v$v" }
          exit 0
      - uses: actions/setup-python@v5
        if: steps.ver.outputs.new == 'true'
        with:
          python-version: "3.13"
      - name: 安裝套件
        if: steps.ver.outputs.new == 'true'
        run: python -m pip install pyautogui opencv-python mss numpy rapidocr_onnxruntime==1.2.3 websocket-client cryptography pyinstaller
      - name: 打包 exe
        if: steps.ver.outputs.new == 'true'
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name RoBot --collect-all rapidocr_onnxruntime --collect-binaries onnxruntime --hidden-import browser_cdp --hidden-import websocket --hidden-import updater --hidden-import licensing --hidden-import minimap gui.py
      - name: 整理檔案
        if: steps.ver.outputs.new == 'true'
        shell: pwsh
        run: |
          Remove-Item dist\RoBot\_internal\msvcp140*.dll -ErrorAction SilentlyContinue
          Copy-Item bot_config.json dist\RoBot\
          Copy-Item *.txt dist\RoBot\
          Copy-Item templates dist\RoBot\templates -Recurse
          Compress-Archive -Path dist\RoBot -DestinationPath RoBot-win.zip
          Set-Content -Path dist\RoBot\no_update.flag -Value "沒有線上更新的版本"
          Compress-Archive -Path dist\RoBot -DestinationPath RoBot-win-noupdate.zip
          Remove-Item dist\RoBot\no_update.flag
          git archive --format=zip -o RoBot-src.zip HEAD
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.new == 'true'
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            RoBot-win.zip
            RoBot-win-noupdate.zip
            RoBot-src.zip
          body_path: RELEASE_NOTES.md
